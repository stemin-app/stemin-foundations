  <text x="315" y="32" text-anchor="middle" font-size="12" fill="#000000" stroke="none">loss</text>
  <line x1="60" y1="60" x2="60" y2="118" stroke="#000000" stroke-dasharray="3 4"/>
  <line x1="230" y1="60" x2="230" y2="118" stroke="#000000" stroke-dasharray="3 4"/>
  <line x1="400" y1="60" x2="400" y2="118" stroke="#000000" stroke-dasharray="3 4"/>
  <text x="60" y="140" text-anchor="middle" font-size="14" fill="#000000" stroke="none">∇ₓL</text>
  <text x="230" y="140" text-anchor="middle" font-size="14" fill="#000000" stroke="none">∇ₕL</text>
  <text x="400" y="140" text-anchor="middle" font-size="14" fill="#000000" stroke="none">L</text>
  <line x1="375" y1="135" x2="264" y2="135" stroke="#0000ff"/>
  <path d="M255 135 L264 131.4 L264 138.6 Z" fill="#0000ff" stroke="none"/>
