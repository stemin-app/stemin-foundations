<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <title>The forward pass and the backward pass</title>
