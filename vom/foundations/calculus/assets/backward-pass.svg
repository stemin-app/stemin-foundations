  <text x="230" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000" stroke="none">h</text>
  <rect x="365" y="20" width="70" height="40" fill="none" stroke="#000000"/>
  <text x="400" y="45" text-anchor="middle" font-size="15" font-style="italic" fill="#000000" stroke="none">L</text>
  <line x1="95" y1="40" x2="186" y2="40" stroke="#000000"/>
  <path d="M195 40 L186 36.4 L186 43.6 Z" fill="#000000" stroke="none"/>
