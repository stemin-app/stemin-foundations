<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <title>The chain rule as amplification</title>
  <rect x="40" y="20" width="60" height="40" fill="none" stroke="#000000"/>
  <text x="70" y="45" text-anchor="middle" font-size="15" font-style="italic" fill="#000000" stroke="none">x</text>
  <rect x="210" y="20" width="60" height="40" fill="none" stroke="#000000"/>
  <text x="240" y="45" text-anchor="middle" font-size="15" font-style="italic" fill="#000000" stroke="none">u</text>
  <rect x="380" y="20" width="60" height="40" fill="none" stroke="#000000"/>
  <text x="410" y="45" text-anchor="middle" font-size="15" font-style="italic" fill="#000000" stroke="none">y</text>
  <line x1="100" y1="40" x2="200" y2="40" stroke="#000000"/>
  <path d="M209 40 L200 36.4 L200 43.6 Z" fill="#000000" stroke="none"/>
  <text x="155" y="32" text-anchor="middle" font-size="14" font-style="italic" fill="#000000" stroke="none">g</text>
  <line x1="270" y1="40" x2="370" y2="40" stroke="#000000"/>
  <path d="M379 40 L370 36.4 L370 43.6 Z" fill="#000000" stroke="none"/>
  <text x="325" y="32" text-anchor="middle" font-size="14" font-style="italic" fill="#000000" stroke="none">f</text>
  <text x="70" y="108" text-anchor="middle" font-size="13" fill="#000000" stroke="none">Δx = 1</text>
  <text x="240" y="108" text-anchor="middle" font-size="13" fill="#000000" stroke="none">Δu = du/dx</text>
  <text x="474" y="108" text-anchor="end" font-size="13" fill="#000000" stroke="none">Δy = (dy/du)(du/dx)</text>
  <line x1="104" y1="104" x2="190" y2="104" stroke="#000000" stroke-dasharray="5 4"/>
  <path d="M199 104 L190 100.4 L190 107.6 Z" fill="#000000" stroke="none"/>
  <text x="150" y="126" text-anchor="middle" font-size="12" fill="#000000" stroke="none">amplify by du/dx</text>
  <line x1="282" y1="104" x2="322" y2="104" stroke="#000000" stroke-dasharray="5 4"/>
  <path d="M331 104 L322 100.4 L322 107.6 Z" fill="#000000" stroke="none"/>
  <text x="300" y="126" text-anchor="middle" font-size="12" fill="#000000" stroke="none">amplify by dy/du</text>
  <path d="M40 150 Q40 162 52 162 L228 162 Q240 162 240 174 Q240 162 252 162 L428 162 Q440 162 440 150" fill="none" stroke="#0000ff"/>
  <text x="240" y="200" text-anchor="middle" font-size="13" fill="#0000ff" stroke="none">total: dy/dx = (dy/du)(du/dx)</text>
</svg>
