<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 225" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <title>Two paths from x to z</title>
  <circle cx="60" cy="110" r="22" fill="none" stroke="#000000"/>
  <text x="60" y="115" text-anchor="middle" font-size="15" font-style="italic" fill="#000000" stroke="none">x</text>
  <circle cx="230" cy="45" r="22" fill="none" stroke="#000000"/>
  <text x="230" y="50" text-anchor="middle" font-size="15" font-style="italic" fill="#000000" stroke="none">y₁</text>
  <circle cx="230" cy="175" r="22" fill="none" stroke="#000000"/>
  <text x="230" y="180" text-anchor="middle" font-size="15" font-style="italic" fill="#000000" stroke="none">y₂</text>
  <circle cx="400" cy="110" r="22" fill="none" stroke="#0000ff"/>
  <text x="400" y="115" text-anchor="middle" font-size="15" font-style="italic" fill="#0000ff" stroke="none">z</text>
  <line x1="80.5" y1="102.1" x2="201.1" y2="56.1" stroke="#000000"/>
  <path d="M209.5 52.9 L202.4 59.5 L199.8 52.7 Z" fill="#000000" stroke="none"/>
  <line x1="80.5" y1="117.9" x2="201.1" y2="163.9" stroke="#000000"/>
  <path d="M209.5 167.1 L199.8 167.3 L202.4 160.5 Z" fill="#000000" stroke="none"/>
  <line x1="250.5" y1="52.9" x2="371.1" y2="98.9" stroke="#000000"/>
  <path d="M379.5 102.1 L369.8 102.3 L372.4 95.5 Z" fill="#000000" stroke="none"/>
  <line x1="250.5" y1="167.1" x2="371.1" y2="121.1" stroke="#000000"/>
  <path d="M379.5 117.9 L372.4 124.5 L369.8 117.7 Z" fill="#000000" stroke="none"/>
  <text x="128" y="66" text-anchor="middle" font-size="13" fill="#000000" stroke="none">dy₁/dx</text>
  <text x="128" y="164" text-anchor="middle" font-size="13" fill="#000000" stroke="none">dy₂/dx</text>
  <text x="334" y="66" text-anchor="middle" font-size="13" fill="#000000" stroke="none">∂z/∂y₁</text>
  <text x="334" y="164" text-anchor="middle" font-size="13" fill="#000000" stroke="none">∂z/∂y₂</text>
  <text x="230" y="216" text-anchor="middle" font-size="13" fill="#000000" stroke="none">multiply along each path, then add the paths</text>
</svg>
