<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <title>An RNN unrolled through time</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#000000" stroke="none"/>
    </marker>
  </defs>
  <rect x="20" y="60" width="56" height="40" rx="6"/>
  <rect x="140" y="60" width="56" height="40" rx="6"/>
  <rect x="260" y="60" width="56" height="40" rx="6"/>
  <rect x="380" y="60" width="56" height="40" rx="6"/>
  <text x="48" y="85" text-anchor="middle" font-size="19" font-style="italic" fill="#000000" stroke="none">h₀</text>
  <text x="168" y="85" text-anchor="middle" font-size="19" font-style="italic" fill="#000000" stroke="none">h₁</text>
  <text x="288" y="85" text-anchor="middle" font-size="19" font-style="italic" fill="#000000" stroke="none">h₂</text>
  <text x="408" y="85" text-anchor="middle" font-size="19" font-style="italic" fill="#000000" stroke="none">h₃</text>
  <line x1="76" y1="80" x2="138" y2="80" stroke="#0000ff" marker-end="url(#arrow)"/>
  <line x1="196" y1="80" x2="258" y2="80" stroke="#0000ff" marker-end="url(#arrow)"/>
  <line x1="316" y1="80" x2="378" y2="80" stroke="#0000ff" marker-end="url(#arrow)"/>
  <line x1="436" y1="80" x2="480" y2="80" stroke-dasharray="4 4"/>
  <text x="107" y="72" text-anchor="middle" font-size="15" fill="#0000ff" stroke="none">Wₕ</text>
  <text x="227" y="72" text-anchor="middle" font-size="15" fill="#0000ff" stroke="none">Wₕ</text>
  <text x="347" y="72" text-anchor="middle" font-size="15" fill="#0000ff" stroke="none">Wₕ</text>
  <text x="498" y="84" text-anchor="middle" font-size="18" fill="#000000" stroke="none">…</text>
  <circle cx="168" cy="160" r="16"/>
  <circle cx="288" cy="160" r="16"/>
  <circle cx="408" cy="160" r="16"/>
  <text x="168" y="165" text-anchor="middle" font-size="18" font-style="italic" fill="#000000" stroke="none">x₁</text>
  <text x="288" y="165" text-anchor="middle" font-size="18" font-style="italic" fill="#000000" stroke="none">x₂</text>
  <text x="408" y="165" text-anchor="middle" font-size="18" font-style="italic" fill="#000000" stroke="none">x₃</text>
  <line x1="168" y1="144" x2="168" y2="102" marker-end="url(#arrow)"/>
  <line x1="288" y1="144" x2="288" y2="102" marker-end="url(#arrow)"/>
  <line x1="408" y1="144" x2="408" y2="102" marker-end="url(#arrow)"/>
  <text x="180" y="128" font-size="15" fill="#000000" stroke="none">Wₓ</text>
  <text x="300" y="128" font-size="15" fill="#000000" stroke="none">Wₓ</text>
  <text x="420" y="128" font-size="15" fill="#000000" stroke="none">Wₓ</text>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#000000" stroke="none">the same weights at every step</text>
</svg>
